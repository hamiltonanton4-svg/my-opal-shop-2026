<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opalwave | Collections</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <header class="hero" style="padding: 8rem 0 4rem 0;">
      <span class="pill">Selected Iterations</span>
      <h1>Selected<br>Pieces.</h1>
      <p style="color: var(--text-muted); max-width: 500px; margin-top: 1rem;">
        Digital luxury and physical protection. Filter by archive series or search for specific iterations.
      </p>
    </header>

    <section class="filter-section" style="margin-bottom: 4rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 2rem 0;">
      <div style="display: flex; flex-wrap: wrap; gap: 3rem; align-items: center; justify-content: space-between;">
        
        <div style="display: flex; gap: 2rem;">
          <div class="filter-group">
            <label style="font-size: 0.6rem; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 0.5rem; font-weight: 900;">Category</label>
            <select id="categoryFilter" style="background: transparent; color: #fff; border: none; font-weight: 700; outline: none; cursor: pointer;">
              <option value="all">All Archive</option>
              <option value="essentials">Essentials</option>
              <option value="outerwear">Outerwear</option>
            </select>
          </div>

          <div class="filter-group">
            <label style="font-size: 0.6rem; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 0.5rem; font-weight: 900;">Sort</label>
            <select id="sortFilter" style="background: transparent; color: #fff; border: none; font-weight: 700; outline: none; cursor: pointer;">
              <option value="default">Release Date</option>
              <option value="price-low">Price: Low-High</option>
              <option value="price-high">Price: High-Low</option>
            </select>
          </div>
        </div>

        <div class="search-wrap" style="flex-grow: 1; max-width: 400px;">
          <input id="searchInput" type="text" placeholder="Search archive..." style="width: 100%; background: var(--glass); border: 1px solid var(--border); padding: 1rem; color: #fff; border-radius: 4px; outline: none;" />
        </div>

        <div style="display: flex; align-items: center; gap: 1rem;">
